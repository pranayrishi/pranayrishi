name: Refresh profile README

on:
  schedule:
    - cron: "17 14 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_readme.py, .github/workflows/build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update lists
        run: python build_readme.py
      - name: Commit if changed
        run: |-
          git config user.name "readme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh latest posts and videos" || exit 0
          git push
